const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(SALT),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(IV)},key,u(CT));
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const err=document.getElementById("err"); err.textContent="";
  try{ const html=await open(document.getElementById("pw").value.trim());
    document.getElementById("content").innerHTML=html; document.getElementById("content").hidden=false; document.getElementById("gate").hidden=true;
    try{sessionStorage.setItem("w23",document.getElementById("pw").value.trim())}catch(_){}
  }catch(_){ err.textContent="That's not it. Ask Lisa."; }
});
try{ const s=sessionStorage.getItem("w23"); if(s){ document.getElementById("pw").value=s; document.getElementById("f").requestSubmit(); } }catch(_){}
